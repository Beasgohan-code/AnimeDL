# ============================================================================
#  AnimeDL — Docker Compose deployment
#  1) cp .env.example .env   and fill in your values
#  2) docker compose up -d
# ============================================================================
services:
  animedl:
    build: .
    container_name: animedl
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - animedl_data:/tmp/animedl          # leech scratch space + sessions
      - ./binary:/app/binary               # keep binaries external if you like
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  animedl_data:
